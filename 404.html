<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empty shelf · SOBA</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b2ae8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b2ae8'/%3E%3Cpath d='M26 14h12v6h-1v5l6 6v22l-3 3H24l-3-3V31l6-6v-5h-1z' fill='%23f6b976'/%3E%3Ccircle cx='50' cy='16' r='6' fill='%23ff6a3d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Instrument+Sans:wght@400;500&family=Azeret+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--blue:#1b2ae8;--paper:#f6b976;--paper-dim:rgba(246,185,118,.92);--paper-line:rgba(246,185,118,.3);--signal:#ff6a3d;--ink:#0b0f3a;
  --display:"Syne",system-ui,sans-serif;--body:"Instrument Sans",system-ui,sans-serif;--mono:"Azeret Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{background:var(--blue)}
body{margin:0;color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
.page{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(18px,2.6vw,36px);gap:32px}
.top{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:12px;letter-spacing:.07em;text-transform:uppercase}
.wordmark{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.03em;text-decoration:none;text-transform:none;line-height:1}
.top span{color:var(--paper-dim)}
main{display:grid;align-content:center;justify-items:start;gap:24px}
.plinth{width:min(420px,100%);height:1px;background:var(--paper-line);position:relative;margin-top:24px}
.plinth::after{content:"";position:absolute;left:12%;right:12%;top:-6px;height:4px;border-radius:50%;background:rgba(0,0,0,.3)}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(44px,7.3vw,110px);line-height:.94;letter-spacing:-.035em}
p{margin:0;max-width:40ch;color:var(--paper-dim);font-size:clamp(17px,1.35vw,21px)}
.cta{display:inline-flex;align-items:center;gap:12px;background:var(--signal);color:var(--ink);text-decoration:none;font-weight:500;padding:16px 24px;border-radius:999px;transition:transform .18s ease}
.cta:hover{transform:translateY(-2px)}
.cta:focus-visible{outline:3px solid var(--paper);outline-offset:4px}
.foot{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-dim)}
</style>
</head>
<body>
<div class="page">
  <header class="top"><a class="wordmark" href="/">SOBA</a><span>Item not found</span></header>
  <main>
    <div class="plinth" aria-hidden="true"></div>
    <h1>This shelf<br>is empty.</h1>
    <p>Nothing lives at this address yet, which is on brand. The front of the shop is this way.</p>
    <a class="cta" href="/">Back to the front<span aria-hidden="true">→</span></a>
  </main>
  <footer class="foot">© 2026 SOBA Delights</footer>
</div>
</body>
</html>
